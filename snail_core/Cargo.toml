[package]
name = "snail_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "snail_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pyo3 = { version = "0.23", features = ["extension-module"] }

[features]
extension-module = ["pyo3/extension-module"]